name: Release

on:
  push:
    tags: ["v*"]

# Creating the release and uploading its assets needs write access, which
# repositories don't always grant workflows by default.
permissions:
  contents: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} --draft --verify-tag --title ${{ github.ref_name }}

  build-plugin:
    needs: ["create-release"]
    name: Build Roblox Studio Plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Rokit
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: 'v1.1.0'

      - name: Build Plugin
        run: rojo build plugin.project.json --output RojoTeamCreate.rbxm

      - name: Upload Plugin to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} RojoTeamCreate.rbxm

      - name: Upload Plugin to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RojoTeamCreate.rbxm
          path: RojoTeamCreate.rbxm
      
      - name: Upload Plugin to Roblox
        env:
          RBX_API_KEY: ${{ secrets.PLUGIN_UPLOAD_TOKEN }}
          RBX_UNIVERSE_ID: ${{ vars.PLUGIN_CI_PLACE_ID }}
          RBX_PLACE_ID: ${{ vars.PLUGIN_CI_UNIVERSE_ID }}
        run: |
          # Releases still work without a Roblox plugin asset to publish to.
          if [ -z "$RBX_API_KEY" ]; then
            echo "PLUGIN_UPLOAD_TOKEN is not set, skipping the Roblox upload."
            exit 0
          fi
          lune run upload-plugin RojoTeamCreate.rbxm
